<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Turnos Hospitalarios</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Sistema de Gestión de Turnos</h1>
    </header>
    <main class="container">
        <!-- SECCIÓN IZQUIERDA: REGISTRO -->
        <section class="registro-section">
            <h2>Nuevo Turno</h2>
            <form id="turnoForm">
                <div class="form-group">
                    <label for="nombre">Nombre del Paciente:</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="form-group">
                    <label for="dni">DNI:</label>
                    <input type="text" id="dni" required>
                </div>
                <div class="form-group">
                    <label for="especialidad">Especialidad:</label>
                    <select id="especialidad" required>
                        <option value="Cardiología">Cardiología</option>
                        <option value="Pediatría">Pediatría</option>
                        <option value="Traumatología">Traumatología</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="fecha">Fecha:</label>
                    <input type="date" id="fecha" required>
                </div>
                <div class="form-group">
                    <label for="hora">Horario:</label>
                    <select id="hora" required></select>
                </div>
                <button type="submit">Guardar Turno Asignado</button>
            </form>
        </section>

        <!-- SECCIÓN DERECHA: PANEL -->
        <section class="panel-section">
            <h2>Turnos Registrados</h2>
            <div id="listaTurnos" class="lista-turnos"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
